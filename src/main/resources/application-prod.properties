spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Session cookie hardening (docs/09-security-threat-model.md item 11,
# Session Theft) -- previously relied entirely on framework defaults with
# no explicit configuration anywhere. secure=true requires HTTPS, which
# production always has (behind the Cloudflare Tunnel) but local/dev HTTP
# does not -- kept prod-only rather than in the shared application.properties
# for exactly that reason. Does not touch the CSRF cookie
# (CookieCsrfTokenRepository in SecurityConfig), which already has
# carefully-tuned, documented behavior not worth risking here.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Structured (ECS-shaped) JSON logs for production, so log lines are
# machine-parseable and each request's correlation id (set by
# CorrelationIdFilter, put in MDC) is automatically included as a field --
# see docs/09-security-threat-model.md and docs/03-target-architecture.md.
logging.structured.format.console=ecs
logging.structured.json.context.include=true
logging.structured.ecs.service.name=familytree

# Real datasource/admin credentials come from the external, git-ignored
# /srv/config/familytree/application.properties (loaded via
# --spring.config.additional-location), not from env vars -- this file used
# to also declare spring.datasource.*/app.admin.*/app.lineage.* with
# ${VAR:}-style placeholders that were never actually wired up (no such env
# vars exist in familytree.env). Since a profile-specific packaged properties
# file like this one takes precedence over a non-profile-specific external
# one, those placeholder lines would have silently overridden the real
# external values with empty strings the moment this profile was ever
# activated -- removed rather than risk that.
