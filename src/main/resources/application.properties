spring.application.name=FamilyTree

# Flyway now owns schema changes; Hibernate only validates entities against
# it at startup. baseline-on-migrate lets Flyway adopt an existing, non-empty
# database (dev/prod, already shaped by the old ddl-auto=update) by marking
# V1 as already applied there, while a genuinely fresh database (new local
# setup, CI, staging) executes V1 normally to create the schema from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema as generated by ddl-auto=update prior to Flyway adoption

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8
spring.profiles.default=dev
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.port=8080

# Trusts X-Forwarded-Proto/-Host/-Port from the reverse proxy in front of this
# app (nginx, itself behind a Cloudflare Tunnel that terminates HTTPS -- see
# RateLimitFilter's CF-Connecting-IP handling). Without this, Spring/Tomcat
# only ever sees the plain-HTTP connection nginx makes to it, so any
# sendRedirect() with a relative path (e.g. formLogin's defaultSuccessUrl)
# gets expanded to an http:// URL -- a scheme mismatch against the real
# https:// page origin that a live click-through of docs/09-security-threat-
# model.md item 6's new CSP (form-action 'self') caught: the login redirect
# was silently blocked as cross-origin. Harmless with no proxy in front (dev,
# local), since there's no X-Forwarded-* header to trust in the first place.
server.forward-headers-strategy=framework

# The service runs with the "dev" default profile in production (the external
# config in /home/yuva/familytree-config/ supplies the prod overrides), so
# actuator exposure lives here rather than in application-prod.properties.
management.endpoints.web.exposure.include=health,prometheus

app.admin.username=
app.admin.password=
app.dev-user.username=
app.dev-user.password=
app.lineage.default-last-name=
app.lineage.default-gender=

# Photo storage (PhotoStorageService, shared by Picture Album and the
# signup photo picker) -- not a secret like the credentials above, so a
# real default lives here rather than needing the external prod config
# to supply it. /srv/data/familytree is this host's established
# convention for app-owned data outside both the repo and /srv/config
# (root-owned, reserved for actual secrets). application-local.properties
# overrides this to a git-ignored relative path so local dev doesn't
# need /srv/data to exist at all.
app.uploads.directory=/srv/data/familytree/uploaded-pics

# Original upload cap before re-encoding (PersonPhotoService enforces its
# own, tighter per-person-photo-count cap separately) -- generous enough
# for a real phone photo, small enough that a request this size can't be
# used to exhaust disk/memory before validation even runs.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.names.backfill-missing-nepali-on-startup=false

# Forgot-password / email-verification sending -- see
# com.familytree.services.email.{SesSmtpEmailService,LoggingEmailService}.
# app.email.enabled gates which of the two beans activates; deliberately a
# plain property, not a @Profile("prod") split, since production actually
# runs the "dev" Spring profile (see the forward-headers-strategy comment
# above). Real values (from-address, frontend-base-url, SES SMTP host/
# username/password) belong only in the external, git-ignored
# /srv/config/familytree/application.properties -- never here.
# spring-boot-starter-mail auto-registers a health indicator that actively
# tries to connect to spring.mail.host to report status -- meaningless (and
# actively harmful, dragging /actuator/health to DOWN) whenever email isn't
# actually configured, which is the default everywhere including production
# until the external config sets real SES credentials (see app.email.enabled
# above). EmailService's own callers already handle send failures with a
# try/catch (best-effort, non-blocking -- see SignupService/
# PasswordResetService), so this probe adds no real safety net.
management.health.mail.enabled=false

app.email.enabled=false
app.email.from-address=
app.frontend-base-url=http://localhost:3020
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
