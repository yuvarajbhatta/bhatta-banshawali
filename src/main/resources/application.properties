spring.application.name=FamilyTree

# Flyway now owns schema changes; Hibernate only validates entities against
# it at startup. baseline-on-migrate lets Flyway adopt an existing, non-empty
# database (dev/prod, already shaped by the old ddl-auto=update) by marking
# V1 as already applied there, while a genuinely fresh database (new local
# setup, CI, staging) executes V1 normally to create the schema from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema as generated by ddl-auto=update prior to Flyway adoption

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8
spring.profiles.default=dev
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.port=8080

# The service runs with the "dev" default profile in production (the external
# config in /home/yuva/familytree-config/ supplies the prod overrides), so
# actuator exposure lives here rather than in application-prod.properties.
management.endpoints.web.exposure.include=health,prometheus

app.admin.username=
app.admin.password=
app.dev-user.username=
app.dev-user.password=
app.lineage.default-last-name=
app.lineage.default-gender=
app.names.backfill-missing-nepali-on-startup=false
