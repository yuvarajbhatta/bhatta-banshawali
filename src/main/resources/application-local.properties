# Local development against the dockerized MySQL in docker-compose.yml
# (docker compose up -d), not the shared/legacy `dev` datasource.
spring.datasource.url=jdbc:mysql://localhost:3307/familytree_dev
spring.datasource.username=familytree_dev
spring.datasource.password=familytree_dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true

app.admin.username=admin
app.admin.password=admin123
app.dev-user.username=user
app.dev-user.password=user123
app.lineage.default-last-name=
app.lineage.default-gender=
app.uploads.directory=./uploads/photos
