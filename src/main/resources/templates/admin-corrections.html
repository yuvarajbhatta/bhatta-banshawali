<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{adminCorrections.title}">Correction Requests</title>
    <link rel="stylesheet" href="/css/admin-signups.css">
</head>
<body>
<div th:replace="~{fragments/language-switch :: switcher}"></div>

<div class="container">
    <div class="page-header">
        <div>
            <p class="eyebrow" th:text="#{adminSignups.eyebrow}">Administration</p>
            <h1 th:text="#{adminCorrections.title}">Correction Requests</h1>
        </div>
        <div class="header-actions">
            <a href="/persons" class="text-link" th:text="#{nav.backHome}">Back Home</a>
        </div>
    </div>

    <nav class="status-filter">
        <a th:each="s : ${statuses}"
           th:href="@{/admin/corrections(status=${s})}"
           th:classappend="${s == selectedStatus} ? 'active'"
           th:text="${#messages.msg('correctionRequestStatus.' + s)}">Status</a>
    </nav>

    <table th:if="${!#lists.isEmpty(requests)}">
        <tr>
            <th th:text="#{adminCorrections.person}">Person</th>
            <th th:text="#{adminCorrections.field}">Field</th>
            <th th:text="#{adminCorrections.currentValue}">Current Value</th>
            <th th:text="#{adminCorrections.proposedValue}">Proposed Value</th>
            <th th:text="#{adminCorrections.reason}">Reason</th>
            <th th:text="#{adminCorrections.submittedBy}">Submitted By</th>
            <th th:if="${selectedStatus.name() == 'PENDING'}" th:text="#{persons.actions}">Actions</th>
        </tr>
        <tr th:each="request : ${requests}">
            <td>
                <a th:href="@{'/persons/' + ${request.person.id}}" th:text="${@personDisplay.englishFullName(request.person)}"></a>
            </td>
            <td th:text="${#messages.msg('correctablePersonField.' + request.field)}"></td>
            <td th:text="${request.currentValueSnapshot != null ? request.currentValueSnapshot : '—'}"></td>
            <td th:text="${request.proposedValue}"></td>
            <td th:text="${request.reason}"></td>
            <td th:text="${request.submittedBy.email}"></td>
            <td th:if="${selectedStatus.name() == 'PENDING'}">
                <form th:action="@{'/admin/corrections/' + ${request.id} + '/approve'}" method="post" class="decision-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" th:formaction="@{'/admin/corrections/' + ${request.id} + '/approve'}"
                            class="btn btn-approve" th:text="#{adminSignups.approve}">Approve</button>
                    <button type="submit" th:formaction="@{'/admin/corrections/' + ${request.id} + '/reject'}"
                            class="btn btn-reject" th:text="#{adminSignups.reject}">Reject</button>
                </form>
            </td>
        </tr>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(requests)}" th:text="#{adminCorrections.empty}">
        No correction requests in this status.
    </div>
</div>

<script th:replace="~{fragments/language-switch :: script}"></script>
</body>
</html>
