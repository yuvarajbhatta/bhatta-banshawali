<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{person.details.title}">Person Details</title>
    <link rel="stylesheet" href="/css/person-details.css">
</head>
<body>
<div th:replace="~{fragments/language-switch :: switcher}"></div>

<div class="container">
    <div class="page-header">
        <a href="/persons" class="back-link" th:text="#{nav.backToPersons}">Back to Persons</a>
        <div class="header-actions" sec:authorize="hasRole('ADMIN')">
            <a class="btn btn-primary" th:href="@{'/persons/edit/' + ${person.id}}" th:text="#{persons.edit}">Edit</a>
            <form th:action="@{'/persons/delete/' + ${person.id}}" method="post"
                  th:attr="onsubmit=|return confirm('${#messages.msg('persons.delete.confirm')}')|">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-danger" th:text="#{persons.delete}">Delete</button>
            </form>
        </div>
    </div>

    <div class="hero">
        <div class="photo-panel">
            <img th:if="${person.photoPath != null and !person.photoPath.isBlank()}" th:src="${person.photoPath}" th:alt="${@personDisplay.englishFullName(person)}">
            <div th:if="${person.photoPath == null or person.photoPath.isBlank()}" class="photo-placeholder" th:text="#{person.details.photoUnavailable}">
                Photo not added
            </div>
        </div>

        <div class="hero-content">
            <p class="eyebrow" th:text="#{person.details.title}">Person Details</p>
            <h1 th:text="${@personDisplay.englishFullName(person)}"></h1>
            <p class="nepali-name" th:if="${@personDisplay.hasNepaliName(person)}" th:text="${@personDisplay.nepaliFullName(person)}"></p>
            <div class="tag-row">
                <span class="tag" th:if="${person.nickname != null and !person.nickname.isBlank()}" th:text="${person.nickname}"></span>
                <span class="tag" th:if="${person.gender != null}" th:text="${#messages.msg('gender.' + person.gender)}"></span>
                <span class="tag" th:if="${person.generationNumber != null}" th:text="${#messages.msg('person.generationNumber') + ': ' + person.generationNumber}">Generation Number: 1</span>
            </div>
        </div>
    </div>

    <div class="section">
        <h2 th:text="#{person.details.basicInfo}">Basic Information</h2>
        <div class="detail-grid">
            <div class="detail-card">
                <span class="label" th:text="#{person.details.englishName}">English Name</span>
                <span th:text="${@personDisplay.englishFullName(person)}"></span>
            </div>
            <div class="detail-card">
                <span class="label" th:text="#{person.details.nepaliName}">Nepali Name</span>
                <span th:text="${@personDisplay.hasNepaliName(person) ? @personDisplay.nepaliFullName(person) : #messages.msg('person.details.notAdded')}"></span>
            </div>
            <div class="detail-card">
                <span class="label" th:text="#{person.birthDate}">Birth Date</span>
                <span th:text="${person.birthDate != null ? person.birthDate : #messages.msg('person.details.notAdded')}"></span>
            </div>
            <div class="detail-card">
                <span class="label" th:text="#{person.deathDate}">Death Date</span>
                <span th:text="${person.deathDate != null ? person.deathDate : #messages.msg('person.details.notAdded')}"></span>
            </div>
            <div class="detail-card">
                <span class="label" th:text="#{person.birthPlace}">Birth Place</span>
                <span th:text="${person.birthPlace != null and !person.birthPlace.isBlank() ? person.birthPlace : #messages.msg('person.details.notAdded')}"></span>
            </div>
            <div class="detail-card">
                <span class="label" th:text="#{person.currentAddress}">Current Address</span>
                <span th:text="${person.currentAddress != null and !person.currentAddress.isBlank() ? person.currentAddress : #messages.msg('person.details.notAdded')}"></span>
            </div>
            <div class="detail-card">
                <span class="label" th:text="#{person.photoPath}">Photo Path</span>
                <span th:text="${person.photoPath != null and !person.photoPath.isBlank() ? person.photoPath : #messages.msg('person.details.notAdded')}"></span>
            </div>
        </div>
    </div>

    <div class="section">
        <h2 th:text="#{person.details.parents}">Parents</h2>

        <div class="info-row">
            <span class="label" th:text="#{person.details.father} + ':'">Father:</span>
            <span th:if="${#lists.isEmpty(fathers)}" class="muted" th:text="#{person.details.notAdded}">Not added</span>
            <span th:each="rel : ${fathers}">
                <a class="person-link"
                   th:href="@{'/persons/' + ${rel.relatedPerson.id}}"
                   th:text="${@personDisplay.fullName(rel.relatedPerson, #locale)}"></a>
            </span>
        </div>

        <div class="info-row">
            <span class="label" th:text="#{person.details.mother} + ':'">Mother:</span>
            <span th:if="${#lists.isEmpty(mothers)}" class="muted" th:text="#{person.details.notAdded}">Not added</span>
            <span th:each="rel : ${mothers}">
                <a class="person-link"
                   th:href="@{'/persons/' + ${rel.relatedPerson.id}}"
                   th:text="${@personDisplay.fullName(rel.relatedPerson, #locale)}"></a>
            </span>
        </div>
    </div>

    <div class="section">
        <h2 th:text="#{person.details.spouse}">Spouse</h2>
        <div th:if="${#lists.isEmpty(spouses)}" class="muted" th:text="#{person.details.notAdded}">Not added</div>
        <ul th:if="${!#lists.isEmpty(spouses)}">
            <li th:each="spouse : ${spouses}">
                <a class="person-link"
                   th:href="@{'/persons/' + ${spouse.id}}"
                   th:text="${@personDisplay.fullName(spouse, #locale)}"></a>
            </li>
        </ul>
    </div>

    <div class="section">
        <h2 th:text="#{person.details.children}">Children</h2>
        <div th:if="${#lists.isEmpty(children)}" class="muted" th:text="#{person.details.notAdded}">Not added</div>
        <ul th:if="${!#lists.isEmpty(children)}">
            <li th:each="child : ${children}">
                <a class="person-link"
                   th:href="@{'/persons/' + ${child.id}}"
                   th:text="${@personDisplay.fullName(child, #locale)}"></a>
            </li>
        </ul>
    </div>

    <div class="section">
        <h2 th:text="#{person.notes}">Notes</h2>
        <p class="notes" th:if="${person.notes != null and !person.notes.isBlank()}" th:text="${person.notes}"></p>
        <div class="muted" th:if="${person.notes == null or person.notes.isBlank()}" th:text="#{person.details.noNotes}">
            No notes added.
        </div>
    </div>
</div>

<script th:replace="~{fragments/language-switch :: script}"></script>
</body>
</html>
