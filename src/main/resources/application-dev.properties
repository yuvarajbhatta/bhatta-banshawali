# Note: this is also the profile prod falls back to by default (see
# application.properties's spring.profiles.default and docs/01-current-system
# -assessment.md), with its real datasource AND app.admin.*/app.dev-user.*
# credentials supplied by the external config in /srv/config/familytree/
# (not in git) overriding the placeholders below. For a pure local machine
# setup against the dockerized MySQL in docker-compose.yml, use the `local`
# profile (application-local.properties) instead.
spring.datasource.url=jdbc:mysql://localhost:3306/familytree_db
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# app.admin.* / app.dev-user.* are intentionally left blank here (not
# admin/admin123, user/user123) since this file is version-controlled and
# this profile is also prod's default fallback -- see note above. Set them
# in /srv/config/familytree/application.properties instead.
app.admin.username=
app.admin.password=
app.dev-user.username=
app.dev-user.password=
app.lineage.default-last-name=
app.lineage.default-gender=
