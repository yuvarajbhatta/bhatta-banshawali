# Note: application.properties's spring.profiles.default=dev makes this
# the profile Spring falls back to if SPRING_PROFILES_ACTIVE is ever unset --
# no longer prod's actual profile day-to-day (prod's systemd EnvironmentFile,
# /srv/config/familytree/familytree.env, explicitly sets
# SPRING_PROFILES_ACTIVE=prod as of 2026-07-31; see application-prod.properties
# and docs/09-security-threat-model.md item 11), but still the safety-net
# profile if that env var were ever accidentally dropped. Real datasource
# and app.admin.*/app.dev-user.* credentials, when this profile does load,
# come from the external config in /srv/config/familytree/ (not in git),
# overriding the placeholders below. For a pure local machine setup against
# the dockerized MySQL in docker-compose.yml, use the `local` profile
# (application-local.properties) instead.
spring.datasource.url=jdbc:mysql://localhost:3306/familytree_db
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# app.admin.* / app.dev-user.* are intentionally left blank here (not
# admin/admin123, user/user123) since this file is version-controlled and
# this profile is also prod's default fallback -- see note above. Set them
# in /srv/config/familytree/application.properties instead.
app.admin.username=
app.admin.password=
app.dev-user.username=
app.dev-user.password=
app.lineage.default-last-name=
app.lineage.default-gender=
