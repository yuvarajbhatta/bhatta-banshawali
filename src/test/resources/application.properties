# Tests provide their own ephemeral H2 schema via ddl-auto=create-drop
# (set per-test in @DataJpaTest/@SpringBootTest properties). Flyway is
# disabled here so it doesn't try to migrate those short-lived datasources.
spring.flyway.enabled=false

# Matches src/main/resources/application.properties's own setting -- kept
# in sync so a full-context test exercises the same OSIV-off behavior
# production actually runs under, instead of silently testing against the
# opposite default.
spring.jpa.open-in-view=false

# This file replaces (not merges with) src/main/resources/application.properties
# on the test classpath, so any @Value-injected property with no default
# needs to be repeated here too -- PersonPhotoServiceTest constructs its
# own PersonPhotoService directly with a @TempDir path instead of relying
# on this, so it's only actually needed for a full Spring context load
# (FamilyTreeApplicationTests and friends); the exact value doesn't matter
# since nothing in a full-context test writes a real photo to disk.
app.uploads.directory=${java.io.tmpdir}/familytree-test-uploads
