name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  frontend-build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # actions/setup-node bundles whatever npm ships with the chosen
      # Node build (npm 10.x as of Node 22's current runner image), but
      # this lock file is maintained with npm 11 -- the version local
      # dev and Dependabot's updater both use. npm 10 and 11 resolve
      # optional peer deps (e.g. @swc/helpers under next-intl)
      # differently, so npm 10's stricter `npm ci` sync check rejects a
      # lock file npm 11 considers valid. Pin explicitly rather than
      # inherit whatever the runner image happens to bundle.
      - name: Pin npm version
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
