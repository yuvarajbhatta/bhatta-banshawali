name: Sync main into develop

on:
  push:
    branches: [main]

permissions:
  # enablePullRequestAutoMerge (the "Enable auto-merge" step) needs
  # contents: write for the default GITHUB_TOKEN -- pull-requests: write
  # alone gets "Resource not accessible by integration", confirmed live
  # (the PR still got created fine, just never actually auto-merged).
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse sync PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This gh CLI version doesn't support --json/--jq on `pr create`
          # (it silently prints usage to stderr and exits 1) -- parse the
          # PR number back out of the plain URL it prints to stdout instead.
          existing=$(gh pr list --repo "${{ github.repository }}" --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Reusing existing sync PR #$existing"
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base develop \
            --head main \
            --title "Sync main into develop" \
            --body "Automated sync so develop doesn't miss anything merged directly into main (e.g. a hotfix). Merged automatically right after creation unless it shows conflicts, which need resolving manually." 2>&1) || true
          echo "$url"
          number=$(echo "$url" | grep -oE '[0-9]+$' || true)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge sync PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --auto (deferred auto-merge) needs branch protection configured
          # on the base branch to have anything to defer to -- confirmed live
          # ("Protected branch rules not configured for this branch"), and
          # develop deliberately has none (only main is gated). Nothing
          # blocks an immediate merge here, so just merge it now.
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --merge || \
            echo "Could not merge (may already be merged, have conflicts, or nothing to sync)."
