name: Sync main into develop

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse sync PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This gh CLI version doesn't support --json/--jq on `pr create`
          # (it silently prints usage to stderr and exits 1) -- parse the
          # PR number back out of the plain URL it prints to stdout instead.
          existing=$(gh pr list --repo "${{ github.repository }}" --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Reusing existing sync PR #$existing"
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base develop \
            --head main \
            --title "Sync main into develop" \
            --body "Automated sync so develop doesn't miss anything merged directly into main (e.g. a hotfix). Safe to auto-merge once checks pass; if it shows conflicts, resolve them manually." 2>&1) || true
          echo "$url"
          number=$(echo "$url" | grep -oE '[0-9]+$' || true)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --merge --auto || \
            echo "Could not enable auto-merge (may already be merged, or nothing to sync)."
